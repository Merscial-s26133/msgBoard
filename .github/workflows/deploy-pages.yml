name: Deploy Market Meadow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build browser client
        run: npm run build

      - name: Configure Render backend
        env:
          MARKET_BACKEND_URL: ${{ vars.MARKET_BACKEND_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const value = process.env.MARKET_BACKEND_URL;
          if (!value) {
            throw new Error('Set the repository Actions variable MARKET_BACKEND_URL to your Render service URL.');
          }
          const backend = new URL(value);
          if (backend.protocol !== 'https:') {
            throw new Error('MARKET_BACKEND_URL must use HTTPS.');
          }
          fs.writeFileSync(
            'public/deployment-config.js',
            `window.MARKET_BACKEND_URL = ${JSON.stringify(backend.origin)};\n`
          );
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
